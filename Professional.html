<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional Tikuv Bo‘limi</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f9f9f9;
      color: #333;
    }
    header {
      background: #2980b9;
      color: white;
      padding: 20px;
      text-align: center;
    }
    h1 { margin: 0; }
    main {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }
    section {
      margin-bottom: 40px;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    section h2 {
      color: #2980b9;
      margin-bottom: 15px;
    }
    img {
      max-width: 100%;
      border-radius: 6px;
      margin: 10px;
    }
    iframe {
      width: 100%;
      height: 400px;
      border: none;
      border-radius: 6px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <h1>Professional Tikuv Bo‘limi</h1>
    <p>Bu yerda professional tikuvchilik haqida videolar va rasmlar joylashtirilgan.</p>
  </header>

  <main>
    <!-- Videolar -->
    <section>
      <h2>Videolar</h2>
      <h3>1. Tikuv mashinasida ishlash</h3>
      <iframe src="https://www.youtube.com/embed/77kWwcHbuKw" 
        title="Tikuv mashinasi videosi" allowfullscreen>
      </iframe>

      <h3>2. Professional tikuvchilar uchun maslahatlar</h3>
      <iframe src="https://www.youtube.com/embed/6BxtOC4szRI" 
        title="Tikuvchi maslahatlari videosi" allowfullscreen>
      </iframe>
    </section>

    <!-- Rasmlar -->
    <section>
      <h2>Rasmlar</h2>
      <img src="https://frankfurt.apollo.olxcdn.com/v1/files/o2jeajt0z5iy2-UZ/image" alt="Tikuv mashinasi" width="300">
      <img src="https://files.glotr.uz/company/000/015/958/products/2020/09/02/2020-09-02-12-54-53-880615-08cc751ed0a1b3fd3c70f1734286ec13.jpg?_=ozb9y" alt="Libos tikish jarayoni" width="300">
      <img src="img/tikuv3.jpg" alt="Tikuvchi ish jarayoni" width="300">
    </section>
  </main>

</body>
</html>
